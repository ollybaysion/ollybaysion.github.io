name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 임베딩 모델(@huggingface/transformers, onnxruntime 포함 수백 MB)은 선택 의존성이다.
      # 벡터는 src/data/vectors.json에 커밋되어 오므로 배포는 모델 없이 돈다 —
      # CI=true라 prebuild의 embed는 "빠진 벡터가 있나"만 보고 지나간다.
      NPM_CONFIG_OMIT: optional
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          # 빌드 파이프라인(prebuild)이 .ts 좌표 엔진을 그대로 import 한다 —
          # 타입 스트리핑이 기본으로 켜진 Node가 필요하다.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
